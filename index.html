<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center;
               justify-content: center; background: #0d1117; color: #e6edf3;
               font-family: Arial, sans-serif; }
        .card { width: 340px; background: #161b22; border: 1px solid #30363d;
                border-radius: 10px; padding: 24px; }
        h1 { margin: 0 0 16px; font-size: 20px; }
        label { display: block; margin: 14px 0 6px; font-size: 12px;
                letter-spacing: 1px; text-transform: uppercase; color: #8b949e; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px;
                border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
        input:focus { outline: none; border-color: #4a6cf7; }
        button { width: 100%; margin-top: 20px; padding: 10px; border: 1px solid #4a6cf7;
                 border-radius: 6px; background: #1f2a5c; color: #fff; font-weight: bold;
                 cursor: pointer; }
        button:hover { background: #2a3a7c; }
        .error { background: #3b1219; border: 1px solid #8e2b36; color: #ff8a94;
                 padding: 10px; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Вход в систему</h1>

        {% if error %}
        <div class="error">⚠ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" value="{{ username }}" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
